[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mentora-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi", "pydantic-settings", "sqlalchemy>=2,<3", "psycopg[binary]", "alembic", "uvicorn", "httpx", "PyJWT[crypto]"]

[project.optional-dependencies]
test = ["pytest", "httpx"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["postgres: provisions disposable PostgreSQL using Docker"]
